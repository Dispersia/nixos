[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yomifin-upscale"
version = "0.1.0"
description = "MangaJaNai / IllustrationJaNai manga upscaling HTTP sidecar for the YomiFin Jellyfin plugin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YomiFin contributors" }]
keywords = ["upscale", "manga", "jellyfin", "mangajanai", "realesrgan", "super-resolution"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
# PyTorch + spandrel power the actual models. On Apple Silicon `pip install torch`
# resolves to the Metal (MPS) build; on NVIDIA it resolves to a CUDA build.
pytorch = ["torch>=2.1", "spandrel>=0.3", "numpy>=1.24"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["providers", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"service/app.py" = ["E402"]
"tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
